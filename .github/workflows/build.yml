name: build

on:
  push:
  workflow_dispatch:

jobs:
  receiver:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: target/release/scansend.exe
            name: scansend-windows-x64.exe
          - os: ubuntu-latest
            bin: target/release/scansend
            name: scansend-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p scansend-proto -p scansend-receiver
      - run: cargo build --release -p scansend-receiver
      - shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      # The installer adds a Windows Firewall rule while it has admin rights, so the
      # app itself never has to ask (see installer/windows/ScanSend.iss).
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=$v" "/DSourceExe=$PWD\target\release\scansend.exe" "/DOutputDir=$PWD\setup-out" installer\windows\ScanSend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem setup-out
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: scansend-windows-setup
          path: setup-out/*.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runner ships with the Android SDK and NDK already installed.
      - name: Use preinstalled Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri android init --ci
      # Android 17 (SDK 37) blocks apps that target it from reaching the local
      # network without the ACCESS_LOCAL_NETWORK runtime permission, so the
      # phone silently can't connect to the computer. Target SDK 36 until the
      # app requests that permission itself.
      - name: Target Android SDK 36
        run: |
          f=src-tauri/gen/android/app/build.gradle.kts
          sed -i -E 's/targetSdk = [0-9]+/targetSdk = 36/' "$f"
          grep -n "targetSdk" "$f"
          grep -q "targetSdk = 36" "$f"
      # A release APK signed with ScanSend's permanent key (repository secrets), so each
      # new version installs over the old one. Phones only accept an update signed with
      # the same key. Forks don't have the key and get a debug APK instead.
      - name: Build and sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ../apk-out
          apks=src-tauri/gen/android/app/build/outputs/apk
          if [ -z "$KS_B64" ]; then
            npx tauri android build --debug --apk --target aarch64 --ci
            cp "$(find $apks -name '*debug*.apk' | head -1)" ../apk-out/scansend.apk
            exit 0
          fi
          npx tauri android build --apk --target aarch64 --ci
          in=$(find $apks -name '*release*.apk' | head -1)
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$bt/zipalign" -p -f 4 "$in" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-type PKCS12 --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../apk-out/scansend.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$bt/apksigner" verify --print-certs ../apk-out/scansend.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: scansend-android-apk
          path: apk-out/scansend.apk

  # Each new version (the one in Cargo.toml) gets a GitHub Release with the three apps,
  # so they can be downloaded from the Releases page without signing in.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [receiver, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; bump the version to publish a new one."
            exit 0
          fi
          mkdir out
          cp artifacts/scansend-windows-setup/*.exe out/
          cp artifacts/scansend-windows-x64.exe/scansend-windows-x64.exe "out/ScanSend-$v-windows-x64.exe"
          cp artifacts/scansend-linux-x64/scansend-linux-x64 "out/ScanSend-$v-linux-x64"
          cp "$(find artifacts/scansend-android-apk -name '*.apk' | head -1)" "out/ScanSend-$v-android.apk"
          cat > notes.md <<NOTES
          **Phone (Android):** download \`ScanSend-$v-android.apk\` on the phone and open it. It installs over ScanSend 0.4.0 or newer; if you have 0.3.x, uninstall that once first.

          **Windows:** run \`ScanSend-$v-windows-setup.exe\` (recommended): it installs ScanSend and allows it through Windows Firewall, so it never has to ask. Or run \`ScanSend-$v-windows-x64.exe\` directly without installing.

          **Linux:** make it runnable first: \`chmod +x ScanSend-$v-linux-x64\`, then run it.

          **iPhone:** not on the App Store yet; it can be built from source on a Mac (see the README).
          NOTES
          gh release create "v$v" out/* --title "ScanSend $v" --notes-file notes.md
