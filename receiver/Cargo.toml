[package]
name = "scansend-receiver"
version = "0.4.5"
edition.workspace = true
license.workspace = true
description = "Desktop side of ScanSend: receives scans from your phone and types/copies them"

[[bin]]
name = "scansend"
path = "src/main.rs"

[dependencies]
scansend-proto = { path = "../proto" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
socket2 = { version = "0.6", features = ["all"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false }
dirs = "6"
gethostname = "1"
enigo = "0.6"
arboard = { version = "3", features = ["wayland-data-control"] }
# glow (OpenGL) instead of the default wgpu: wgpu-hal 30 fails to compile on Windows (dx12).
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
auto-launch = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
